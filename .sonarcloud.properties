# Versioned SQL migrations: a down migration restores the previous definition of views it replaces,
# so repeated SQL between migration files is expected and not maintainable duplication.
# Migrations are written for PostgreSQL; SonarCloud runs its Oracle PL/SQL analyzer on .sql files,
# which produces false positives on PostgreSQL idioms (e.g. empty string literals).
sonar.exclusions=migrations/**
sonar.cpd.exclusions=migrations/**,site/demo.js
