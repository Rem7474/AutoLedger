services:
  # One-shot helper: keeps the generated secrets (database password, session secret, encryption key) in a volume
  # shared by the services. A database password set through AUTOLEDGER_DB_PASSWORD (or DB_PASSWORD) is written
  # there as is; every other secret is generated once and kept. Secrets set in the api environment still win.
  secrets-init:
    image: postgres:16-alpine
    restart: "no"
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        gen() { head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
        if [ -n "$$DB_PASSWORD" ]; then printf %s "$$DB_PASSWORD" > /secrets/db_password
        elif [ ! -s /secrets/db_password ]; then gen > /secrets/db_password; fi
        [ -s /secrets/jwt_secret ] || gen > /secrets/jwt_secret
        [ -s /secrets/encryption_key ] || gen > /secrets/encryption_key
        chmod 644 /secrets/db_password /secrets/jwt_secret /secrets/encryption_key
    environment:
      DB_PASSWORD: ${AUTOLEDGER_DB_PASSWORD:-${DB_PASSWORD:-}}
    volumes:
      - autoledger_secrets:/secrets

  postgres:
    image: postgres:16-alpine
    container_name: ${DB_CONTAINER_NAME:-autoledger-db}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTOLEDGER_DB_USER:-${DB_USER:-autoledger}}
      POSTGRES_PASSWORD_FILE: /secrets/db_password
      POSTGRES_DB: ${AUTOLEDGER_DB_NAME:-${DB_NAME:-autoledger}}
    ports:
      # Bound to localhost only: the DB does not need to be reachable from outside the host.
      # Set DB_PORT_BIND to 0.0.0.0:5432 (or similar) if you need external access.
      - "${DB_PORT_BIND:-127.0.0.1:5432}:5432"
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    volumes:
      - autoledger_db_data:/var/lib/postgresql/data
      - autoledger_secrets:/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTOLEDGER_DB_USER:-${DB_USER:-autoledger}} -d ${AUTOLEDGER_DB_NAME:-${DB_NAME:-autoledger}}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    # Pin AUTOLEDGER_VERSION (or TESLACOST_VERSION, e.g. "v1.17.0") in your .env for reproducible deployments.
    # Defaults to "latest" for the quick-start curl-and-go flow described in the README.
    image: ghcr.io/rem7474/autoledger:${AUTOLEDGER_VERSION:-${TESLACOST_VERSION:-latest}}
    pull_policy: missing
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: ${APP_CONTAINER_NAME:-autoledger-app}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      # Covers a slow PostgreSQL crash recovery after an unclean shutdown, which the server itself waits out
      # (up to dbConnectTimeout in cmd/server/main.go) before it starts listening: failures in this window don't
      # count towards retries, so a legitimately slow (but recovering) startup isn't reported unhealthy.
      start_period: 3m30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PORT: 8080
      # This compose file is the production deployment path; docker-compose.dev.yml overrides
      # this back to "development" for the local hot-reload workflow.
      ENVIRONMENT: ${ENVIRONMENT:-production}
      AUTOLEDGER_BASE_URL: ${AUTOLEDGER_BASE_URL:-${APP_BASE_URL:-http://localhost:8080}}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${AUTOLEDGER_DB_USER:-${DB_USER:-autoledger}}
      DB_PASSWORD_FILE: /secrets/db_password
      DB_NAME: ${AUTOLEDGER_DB_NAME:-${DB_NAME:-autoledger}}
      DB_SSLMODE: disable
      AUTOLEDGER_JWT_SECRET_FILE: /secrets/jwt_secret
      AUTOLEDGER_ENCRYPTION_KEY_FILE: /secrets/encryption_key
      AUTOLEDGER_ENCRYPTION_KEY: ${AUTOLEDGER_ENCRYPTION_KEY:-${APP_ENCRYPTION_KEY:-}}
      AUTOLEDGER_JWT_SECRET: ${AUTOLEDGER_JWT_SECRET:-${JWT_SECRET:-}}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-}
      # Reverse proxy and browser hardening (see the README, section "Exposition sur Internet")
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SECURITY_HEADERS: ${SECURITY_HEADERS:-}
      CONTENT_SECURITY_POLICY: ${CONTENT_SECURITY_POLICY:-}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      AUTOLEDGER_DEMO: ${AUTOLEDGER_DEMO:-false}
      AUTOLEDGER_DEMO_EMAIL: ${AUTOLEDGER_DEMO_EMAIL:-}
      AUTOLEDGER_DEMO_PASSWORD: ${AUTOLEDGER_DEMO_PASSWORD:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
      AUTOLEDGER_STORAGE_DIR: ${AUTOLEDGER_STORAGE_DIR:-${STORAGE_DIR:-/data/documents}}
      # --- OIDC / SSO (optional) ---
      # Leave OIDC_ISSUER_URL empty to use local email/password auth only.
      # Uncomment and fill in to enable SSO via Authentik, Keycloak, Authelia, etc.
      # OIDC_ISSUER_URL: https://auth.homelab.local/application/o/autoledger/
      # OIDC_CLIENT_ID: autoledger
      # OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      # OIDC_REDIRECT_URL: https://autoledger.homelab.local/api/auth/oidc/callback
      # OIDC_PROVIDER_NAME: Authentik
      # OIDC_ALLOWED_EMAILS: ${OIDC_ALLOWED_EMAILS:-}
      # OIDC_DISABLE_LOCAL_AUTH: "false"
    ports:
      - "${AUTOLEDGER_PORT:-${PORT:-8080}}:8080"
    volumes:
      - autoledger_documents:/data/documents
      - autoledger_secrets:/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backup:
    # Published alongside the api image with the same tag, so this file works on its own
    # (no repo checkout needed). The build section is only used for local development.
    image: ghcr.io/rem7474/autoledger-backup:${AUTOLEDGER_VERSION:-${TESLACOST_VERSION:-latest}}
    pull_policy: missing
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: ${BACKUP_CONTAINER_NAME:-autoledger-backup}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        # Wait for the app's own healthcheck (which requires a live DB connection) rather than
        # just postgres, so the first backup cycle doesn't race the schema migrations on startup.
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${AUTOLEDGER_DB_USER:-${DB_USER:-autoledger}}
      DB_PASSWORD_FILE: /secrets/db_password
      DB_NAME: ${AUTOLEDGER_DB_NAME:-${DB_NAME:-autoledger}}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - autoledger_documents:/data/documents:ro
      - autoledger_backups:/backups
      - autoledger_secrets:/secrets:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # For existing installations upgrading from TeslaCost:
  # You can keep your existing volumes without migrating data by setting in your .env:
  # DB_VOLUME_NAME=postgres_data
  # DOCUMENTS_VOLUME_NAME=teslacost_documents
  # BACKUPS_VOLUME_NAME=teslacost_backups
  autoledger_db_data:
    name: ${DB_VOLUME_NAME:-autoledger_db_data}
    driver: local
  autoledger_documents:
    name: ${DOCUMENTS_VOLUME_NAME:-autoledger_documents}
    driver: local
  autoledger_backups:
    name: ${BACKUPS_VOLUME_NAME:-autoledger_backups}
    driver: local
  autoledger_secrets:
    name: ${SECRETS_VOLUME_NAME:-autoledger_secrets}
    driver: local
