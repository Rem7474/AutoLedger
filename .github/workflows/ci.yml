name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      backup: ${{ steps.filter.outputs.backup }}
      docker: ${{ steps.filter.outputs.docker }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Select the checks the change needs
        id: filter
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            files=ALL
          else
            files=$(git diff --name-only HEAD^1 HEAD)
          fi
          match() { [ "$files" = ALL ] || printf '%s\n' "$files" | grep -Eq "$1"; }
          flag() { if match "$2"; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi; }
          flag go '^(.*\.go|README(\.fr)?\.md|go\.mod|go\.sum|migrations/|web/embed\.go|\.github/workflows/(ci|codeql)\.yml)'
          flag web '^(web/|\.github/workflows/ci\.yml)'
          flag backup '^(backup/|db-upgrade/|docker-compose\.yml|\.github/workflows/ci\.yml)'
          flag e2e '^(e2e/|web/|cmd/|internal/|migrations/|go\.mod|go\.sum|\.github/workflows/ci\.yml)'
          flag docker '^(Dockerfile|\.dockerignore|go\.mod|go\.sum|web/package(-lock)?\.json|backup/|db-upgrade/|\.github/workflows/(ci|docker-publish)\.yml)'

  backup:
    name: Backup regression tests
    needs: [changes]
    if: needs.changes.outputs.backup == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the backup pipeline in its runtime image
        run: docker run --rm --entrypoint sh -v "$PWD:/repo:ro" postgres:18-alpine /repo/backup/entrypoint_test.sh
      - name: Test the PostgreSQL 16 to 18 upgrade on real containers
        run: sh db-upgrade/upgrade_test.sh

  backend:
    name: Backend Tests & Build
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: teslacost
          POSTGRES_PASSWORD: test
          POSTGRES_DB: teslacost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teslacost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stub the embedded frontend (the Frontend Build job builds the real one)
        run: mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Backend Tests
        env:
          TEST_DATABASE_URL: postgres://teslacost:test@localhost:5432/teslacost_test?sslmode=disable
        run: go test -v -race -coverprofile=coverage.out -coverpkg=./... ./...

      - name: Build Go Server Binary
        run: go build -v -o teslacost-bin ./cmd/server

      - name: Keep the coverage profile for SonarCloud
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go
          path: coverage.out
          retention-days: 1

  govulncheck:
    name: Go Vulnerability Scan
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stub the embedded frontend
        run: mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  frontend:
    name: Frontend Build
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Frontend Dependencies
        run: cd web && npm ci --ignore-scripts

      - name: Run npm audit (frontend dependency vulnerability scan)
        run: cd web && npm audit --audit-level=high

      - name: Run TypeScript Typecheck
        run: cd web && npm run typecheck

      - name: Run Frontend Unit Tests
        run: cd web && npm run test:coverage

      - name: Keep the coverage report for SonarCloud
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-web
          path: web/coverage/lcov.info
          retention-days: 1

      - name: Build Frontend Assets
        run: cd web && npm run build

  e2e:
    name: End-to-end tests
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: teslacost
          POSTGRES_PASSWORD: test
          POSTGRES_DB: teslacost_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teslacost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BASE_URL: http://127.0.0.1:8080
      DEMO_PASSWORD: E2e-passw0rd!x
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build the frontend and the binaries
        run: |
          (cd web && npm ci --ignore-scripts && npm run build)
          go build -o autoledger-server ./cmd/server
          go build -o autoledger-demoseed ./cmd/demoseed

      - name: Start the server and seed the demo dataset
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgres://teslacost:test@localhost:5432/teslacost_e2e?sslmode=disable
          AUTOLEDGER_PORT: 8080
          AUTOLEDGER_STORAGE_DIR: ${{ runner.temp }}/documents
        run: |
          nohup ./autoledger-server > server.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf "$BASE_URL/api/health" >/dev/null && break; sleep 1; done
          ./autoledger-demoseed -url "$BASE_URL"

      - name: Install the test dependencies and the browser
        run: cd e2e && npm ci --ignore-scripts && ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: cd e2e && ./node_modules/.bin/playwright test

      - name: Keep the traces and the server log of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: |
            e2e/test-results
            e2e/playwright-report
            server.log
          retention-days: 7

  docker-build:
    name: Docker Build (no push)
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true'
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      push: false
      platforms: linux/amd64

  docker-publish:
    name: Publish latest images
    if: github.event_name == 'push'
    needs: [backend, frontend, govulncheck, backup]
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      push: true

  sonar:
    name: SonarCloud Scan
    needs: [changes, backend, frontend]
    if: >-
      always() && !cancelled() && vars.SONAR_CI_ANALYSIS == 'true'
      && (needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # One step per report, each into its own folder: a pattern download extracts a lone artifact straight into
      # the target folder, so a run that produced a single report (a frontend-only change) hid it from SonarCloud.
      - name: Download the Go coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: coverage-go
          path: coverage/coverage-go

      - name: Download the web coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: coverage-web
          path: coverage/coverage-web

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci-gate:
    name: CI gate
    if: always()
    needs: [backup, backend, govulncheck, frontend, e2e, docker-build, docker-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a required job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
