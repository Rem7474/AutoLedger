name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: teslacost
          POSTGRES_PASSWORD: test
          POSTGRES_DB: teslacost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teslacost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Frontend Assets
        run: cd web && npm ci --ignore-scripts && npm run build

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Backend Tests
        env:
          TEST_DATABASE_URL: postgres://teslacost:test@localhost:5432/teslacost_test?sslmode=disable
        run: go test -v -race ./...

      - name: Run govulncheck (Go dependency vulnerability scan)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Build Go Server Binary
        run: go build -v -o teslacost-bin ./cmd/server

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Frontend Dependencies
        run: cd web && npm ci --ignore-scripts

      - name: Run npm audit (frontend dependency vulnerability scan)
        run: cd web && npm audit --audit-level=high

      - name: Run TypeScript Typecheck
        run: cd web && npm run typecheck

      - name: Run Frontend Unit Tests
        run: cd web && npm test

      - name: Build Frontend Assets
        run: cd web && npm run build

  docker-build:
    name: Docker Build (no push)
    if: github.event_name == 'pull_request'
    needs: [backend, frontend]
    uses: ./.github/workflows/docker-publish.yml
    with:
      push: false

  docker-publish:
    name: Publish latest images
    if: github.event_name == 'push'
    needs: [backend, frontend]
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      push: true
