name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  verify:
    name: Verify CI is green on the tagged commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "completed")] | sort_by(.created_at) | last | .conclusion // "none"')
          echo "Latest completed CI conclusion for ${GITHUB_SHA}: ${conclusion}"
          if [ "${conclusion}" != "success" ]; then
            echo "::error::No green CI run for this commit. Merge it to main and wait for CI before tagging."
            exit 1
          fi

  publish:
    name: Publish release images
    needs: [verify]
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      push: true

  release:
    name: GitHub Release & Version Sync
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Sync git tag into repository files
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Syncing version $VERSION (tag $TAG) into repository files..."

          # Update web/package.json
          sed -i -E "s/\"version\": \"[^\"]+\"/\"version\": \"${VERSION}\"/" web/package.json

          # Update web/src/version.ts fallback
          sed -i -E "s/v[0-9]+\.[0-9]+\.[0-9]+/v${VERSION}/g" web/src/version.ts

          # Update cmd/server/main.go default
          sed -i -E "s/var AppVersion = \"[^\"]+\"/var AppVersion = \"${VERSION}\"/" cmd/server/main.go

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet; then
            git commit -am "chore(release): sync version to ${TAG} [skip ci]"
            git push origin main
          fi
