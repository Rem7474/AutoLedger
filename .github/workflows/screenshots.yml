name: Screenshots

# Regenerates docs/screenshots from a demo instance (cmd/demoseed) and opens a pull request with the result.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoledger
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: autoledger
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U autoledger" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEMO_PASSWORD: demo-password-ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Build the frontend
        working-directory: web
        run: npm ci --ignore-scripts && npm run build
      - name: Build the server
        run: go build -o autoledger ./cmd/server
      - name: Start the server
        env:
          AUTOLEDGER_PORT: '8080'
          AUTOLEDGER_DATABASE_URL: postgres://autoledger@localhost:5432/autoledger?sslmode=disable
          AUTOLEDGER_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          AUTOLEDGER_JWT_SECRET: screenshots-only-jwt-secret-0123456789abcdef0123456789
          ENVIRONMENT: development
        run: |
          nohup ./autoledger > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/auth/config > /dev/null && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Seed the demo data
        run: go run ./cmd/demoseed -url http://localhost:8080
      - name: Capture
        working-directory: scripts/screenshots
        env:
          BASE_URL: http://localhost:8080
          OUT_DIR: ../../docs/screenshots
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium
          node capture.mjs
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/screenshots && [ -z "$(git ls-files --others --exclude-standard docs/screenshots)" ]; then
            echo "Screenshots unchanged"; exit 0
          fi
          branch="chore/screenshots-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add docs/screenshots
          git commit -m "Refresh documentation screenshots"
          git push --force-with-lease -u origin "$branch"
          gh pr create --title "Refresh documentation screenshots" \
            --body "Generated by the Screenshots workflow from the demo dataset (cmd/demoseed)." || true
