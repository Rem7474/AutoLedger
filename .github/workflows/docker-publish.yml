name: Docker publish

on:
  workflow_call:
    inputs:
      push:
        description: Push the images to GHCR (false builds only)
        type: boolean
        default: true
      platforms:
        description: Target platforms
        type: string
        default: linux/amd64,linux/arm64

permissions:
  contents: read

jobs:
  docker:
    name: Docker ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: autoledger
            suffix: ""
            context: .
            file: ./Dockerfile
            target: prod
          - name: autoledger-backup
            suffix: -backup
            context: ./backup
            file: ./backup/Dockerfile
            target: ""
          - name: autoledger-db-upgrade
            suffix: -db-upgrade
            context: ./db-upgrade
            file: ./db-upgrade/Dockerfile
            target: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: inputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry (GHCR)
        if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/rem7474/${{ matrix.image.name }}
            ghcr.io/${{ github.repository }}${{ matrix.image.suffix }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
