name: Feature request
description: Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the "Out of scope" list in [CONTRIBUTING.md](https://github.com/Rem7474/AutoLedger/blob/main/CONTRIBUTING.md) first: manufacturer-cloud connectors, per-brand parsers and hard-coded brand or model lists are not accepted.
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: How you would like it to work. Mockups welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
